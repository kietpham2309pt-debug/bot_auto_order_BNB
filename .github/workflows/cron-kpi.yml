name: KPI Cron (Vercel) - Manual fallback

# Lịch tự động đã chuyển sang cron-job.org (chính xác hơn, không bị trễ 2-3h như GitHub Actions).
# Workflow này GIỮ LẠI để chạy tay khi cần (Actions tab -> Run workflow -> chọn target).
#
# 3 jobs trên cron-job.org (timezone Asia/Ho_Chi_Minh):
#   jobId 7640833 - Morning  10:00 VN
#   jobId 7640834 - Midshift 14:00 VN
#   jobId 7640835 - Evening  22:00 VN

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Chọn cron để chạy thủ công'
        required: true
        default: 'morning'
        type: choice
        options: [morning, midshift, evening]

env:
  BOT_URL: https://botautoorderbnb-livid.vercel.app

jobs:
  morning:
    if: inputs.target == 'morning'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/morning
        run: |
          curl -fsSL --retry 3 --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ env.BOT_URL }}/api/cron/morning"

  midshift:
    if: inputs.target == 'midshift'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/midshift
        run: |
          curl -fsSL --retry 3 --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ env.BOT_URL }}/api/cron/midshift"

  evening:
    if: inputs.target == 'evening'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/evening
        run: |
          curl -fsSL --retry 3 --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ env.BOT_URL }}/api/cron/evening"
